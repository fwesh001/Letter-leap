<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter-Leap</title>

    <!-- Design System & Styles -->
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/main.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z424QVM52M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-Z424QVM52M');
    </script>
</head>

<body class="page-home">
    <!-- =========================
         Header Section
    ========================== -->
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; padding: 0 1rem;">
            <div class="welcome-text" style="color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem;">
                <i class="ph ph-hand-waving" style="font-size: 1.5rem; color: var(--accent-color);"></i>
                <span>Welcome to Letter-Leap!</span>
            </div>
            
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="HTP.html" class="button" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none;">
                    <i class="ph ph-book-open"></i> How to Play
                </a>
                <!-- Settings Toggle Button (Moved inside header for desktop, absolute for mobile) -->
                <button id="settingsToggleBtn" aria-label="Open Settings">
                    <i class="ph ph-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- =========================
         Main Content Section
    ========================== -->
    <main>
        <h1 style="text-align: center; color: var(--text-primary); margin-bottom: 2rem;">Choose a Mode</h1>
        <div class="game-container">
            <!-- Single-player Mode -->
            <button class="mode-card" id="singlePlayerBtn">
                <i class="ph ph-user mode-icon"></i>
                <span class="mode-title">Single Player</span>
            </button>
            <!-- Multi-player Mode -->
            <a href="mm.html" class="mode-card">
                <i class="ph ph-users mode-icon"></i>
                <span class="mode-title">Multiplayer</span>
            </a>
        </div>
    </main>

    <!-- =========================
         Difficulty Selection Modal
    ========================== -->
    <div id="difficultyModal" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="difficultyTitle">
        <div class="popup-box difficulty-popup">
            <button id="closeDifficultyBtn" class="close-btn" aria-label="Close Difficulty Selection">
                <i class="ph ph-x"></i>
            </button>
            <header class="popup-header">
                <h2 id="difficultyTitle" style="color: var(--primary-color);">Choose Difficulty</h2>
            </header>
            <div class="difficulty-cards-container">
                <!-- Easy Level -->
                <button class="difficulty-card" data-difficulty="easy" style="border-color: var(--success-color);">
                    <i class="ph ph-smiley difficulty-icon" style="color: var(--success-color);"></i>
                    <span class="difficulty-title" style="color: var(--success-color);">Easy</span>
                    <span class="difficulty-stats">60s | 2 words | +10s</span>
                </button>
                <!-- Medium Level -->
                <button class="difficulty-card" data-difficulty="medium" style="border-color: var(--accent-color);">
                    <i class="ph ph-meh difficulty-icon" style="color: var(--accent-color);"></i>
                    <span class="difficulty-title" style="color: var(--accent-color);">Medium</span>
                    <span class="difficulty-stats">40s | 3 words | +5s</span>
                </button>
                <!-- Hard Level -->
                <button class="difficulty-card" data-difficulty="hard" style="border-color: var(--danger-color);">
                    <i class="ph ph-skull difficulty-icon" style="color: var(--danger-color);"></i>
                    <span class="difficulty-title" style="color: var(--danger-color);">Hard</span>
                    <span class="difficulty-stats">30s | 4 words | +5s</span>
                </button>
                <!-- Survival Mode -->
                <button class="difficulty-card" data-difficulty="survival" style="border-color: var(--accent-color);">
                    <i class="ph ph-heart-break difficulty-icon" style="color: var(--accent-color);"></i>
                    <span class="difficulty-title" style="color: var(--accent-color);">Survival</span>
                    <span class="difficulty-stats">No timer | Hearts | Corruption</span>
                    <span style="margin-top: 0.35rem; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px; background: rgba(255, 215, 0, 0.2); color: var(--accent-color); font-weight: 700;">Recommended</span>
                </button>
            </div>
        </div>
    </div>

    <!-- =========================
         Sidebar Settings Menu
    ========================== -->
    <aside id="settingsSidebar" aria-label="Settings Menu">
        <h2 style="color: var(--text-primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Settings</h2>
        
        <button id="muteBtn" class="settings-btn" aria-pressed="false">
            <i class="ph ph-speaker-simple-high"></i> <span>Mute</span>
        </button>
        
        <button id="darkModeBtn" class="settings-btn" aria-pressed="true">
            <i class="ph ph-moon"></i> <span>Dark Mode</span>
        </button>
        
        <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;"></div>

        <button id="Howtoplay" class="settings-btn" onclick="window.location.href='HTP.html'">
            <i class="ph ph-book-open"></i> <span>How to Play</span>
        </button>
        
        <button id="feedbackBtn" class="settings-btn" onclick="window.location.href='feedback.html'">
            <i class="ph ph-pencil-simple"></i> <span>Feedback</span>
        </button>
        
        <button id="Tips" class="settings-btn" onclick="window.location.href='tips.html'">
            <i class="ph ph-gift"></i> <span>Tips</span>
        </button>
        
        <button id="achievementsBtn" class="settings-btn" onclick="window.location.href='achivement.html'">
            <i class="ph ph-medal"></i> <span>Achievements</span>
        </button>
    </aside>

    <!-- =========================
         Audio Elements
    ========================== -->
    <audio id="click-sound" src="/assets/sounds/click.mp3" preload="auto"></audio>

    <!-- =========================
         Scripts
    ========================== -->
        <script src="/js/utils.js"></script>
        <script src="/js/script2.js"></script>
    <script>
        // Difficulty Selection Modal Logic
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('difficultyModal');
            const singlePlayerBtn = document.getElementById('singlePlayerBtn');
            const closeBtn = document.getElementById('closeDifficultyBtn');
            const difficultyCards = document.querySelectorAll('.difficulty-card');

            console.log('[DifficultyModal] Init:', {
                modal: !!modal,
                singlePlayerBtn: !!singlePlayerBtn,
                closeBtn: !!closeBtn,
                cardsCount: difficultyCards.length
            });

            if (!modal || !singlePlayerBtn) {
                console.error('[DifficultyModal] Missing elements!');
                return;
            }

            // Show modal when Single Player is clicked
            singlePlayerBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                console.log('[DifficultyModal] Single Player clicked, showing modal');
                modal.classList.add('show');
                console.log('[DifficultyModal] Modal classes:', modal.className);
            });

            // Hide modal when close button is clicked
            closeBtn.addEventListener('click', () => {
                console.log('[DifficultyModal] Close clicked');
                modal.classList.remove('show');
            });

            // Hide modal when clicking backdrop
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    console.log('[DifficultyModal] Backdrop clicked');
                    modal.classList.remove('show');
                }
            });

            // Hide modal on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    console.log('[DifficultyModal] Escape pressed');
                    modal.classList.remove('show');
                }
            });

            // Handle difficulty selection
            difficultyCards.forEach(card => {
                card.addEventListener('click', () => {
                    const difficulty = card.dataset.difficulty;
                    console.log('[DifficultyModal] Difficulty selected:', difficulty);
                    if (difficulty === 'survival') {
                        localStorage.setItem('gameMode', 'survival');
                        localStorage.setItem('gameDifficulty', 'medium');
                        localStorage.setItem('lastDifficulty', 'survival');
                    } else {
                        localStorage.setItem('gameMode', 'classic');
                        localStorage.setItem('gameDifficulty', difficulty);
                        localStorage.setItem('lastDifficulty', difficulty);
                    }
                    window.location.href = 'sm.html';
                });
            });
        });
    </script>
    <script>
            document.addEventListener('DOMContentLoaded', () => {
                const footer = document.querySelector('body.page-home footer');
                const sentinel = document.getElementById('footer-sentinel');
                if (!footer || !sentinel) return;

                if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver(
                        (entries) => {
                            const entry = entries[0];
                            footer.classList.toggle('footer-visible', entry.isIntersecting);
                        },
                        {
                            root: null,
                            threshold: 0,
                            rootMargin: '0px 0px -20% 0px'
                        }
                    );
                    observer.observe(sentinel);
                } else {
                    let ticking = false;
                    const checkFooter = () => {
                        const nearBottom =
                            window.innerHeight + window.scrollY >=
                            document.documentElement.scrollHeight - 80;
                        footer.classList.toggle('footer-visible', nearBottom);
                        ticking = false;
                    };
                    window.addEventListener('scroll', () => {
                        if (!ticking) {
                            window.requestAnimationFrame(checkFooter);
                            ticking = true;
                        }
                    }, { passive: true });
                    checkFooter();
                }
            });
        </script>

    <!-- =========================
         Footer Section
    ========================== -->
    <div id="footer-sentinel" aria-hidden="true"></div>
    <footer>
        <p>© 2025 Letter-Leap. All rights reserved.</p>
        <p>Made with 💙 by zabdiel.</p>
    </footer>
</body>
</html>
