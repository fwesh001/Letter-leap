<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tips - Letter-Leap</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .word-list-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; padding: 1rem; }
    .tip-card { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 1rem; border-radius: var(--radius-md); text-align: center; color: var(--text-primary); transition: transform 0.2s; }
    .tip-card:hover { transform: scale(1.05); border-color: var(--primary-color); }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; justify-content: center; position: relative; max-width: 800px; margin: 0 auto;">
        <a href="index.html" style="position: absolute; left: 1rem; color: var(--text-primary); text-decoration: none;"><i class="ph ph-arrow-left"></i></a>
        <span>Word Tips</span>
        <button id="settingsToggleBtn" aria-label="Open Settings" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);">
          <i class="ph ph-gear"></i>
        </button>
    </div>
  </header>

  <main class="container" style="max-width: 800px; margin: 0 auto; padding: 2rem 1rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1><i class="ph ph-lightbulb" style="color: var(--accent-color);"></i> Expand Your Vocabulary</h1>
        <p style="color: var(--text-secondary);">Rare and useful words to help you win matches.</p>
        <button class="button" id="refreshBtn" style="margin-top: 1rem;"><i class="ph ph-arrows-clockwise"></i> Get New Tips</button>
    </div>

    <div class="word-list-container" id="wordListContainer">
        <!-- Words will be loaded here by tips.js -->
    </div>
  </main>

    <aside id="settingsSidebar" aria-label="Settings Menu">
      <h2
        style="color: var(--text-primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
        Settings</h2>

      <button id="muteBtn" class="settings-btn" aria-pressed="false">
        <i class="ph ph-speaker-simple-high"></i> <span>Mute</span>
      </button>
      <button id="darkModeBtn" class="settings-btn" aria-pressed="false">
        <i class="ph ph-moon"></i> <span>Dark Mode</span>
      </button>

      <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;"></div>

      <button id="Howtoplay" class="settings-btn" onclick="window.location.href='HTP.html'">
        <i class="ph ph-book-open"></i> <span>How to Play</span>
      </button>
      <button id="feedbackBtn" class="settings-btn" onclick="window.location.href='feedback.html'">
        <i class="ph ph-pencil-simple"></i> <span>Feedback</span>
      </button>
      <button id="Tips" class="settings-btn" onclick="window.location.href='tips.html'">
        <i class="ph ph-gift"></i> <span>Tips</span>
      </button>
    </aside>

  <script src="/js/tips.js"></script>
  <script src="/js/script2.js"></script>
</body>
</html>
