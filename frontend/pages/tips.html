<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tips - Letter-Leap</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/css/tips.css">
</head>
<body class="tips-page">
  <header class="tips-header">
    <div class="tips-header__inner container">
      <a class="tips-back-link" href="/index.html" aria-label="Back to Home">
        <i class="ph ph-arrow-left"></i>
      </a>
      <span class="tips-title">Word Tips</span>
      <button id="settingsToggleBtn" class="tips-settings-btn" aria-label="Open Settings">
        <i class="ph ph-gear"></i>
      </button>
    </div>
  </header>

  <main class="container tips-main">
    <section class="tips-hero">
      <h1 class="tips-hero__title">
        <i class="ph ph-lightbulb"></i> Expand Your Vocabulary
      </h1>
      <p class="tips-hero__subtitle">Pick a letter to explore word tips and achievements.</p>
      <div class="tips-search" role="search">
        <i class="ph ph-magnifying-glass tips-search__icon" aria-hidden="true"></i>
        <input
          id="searchInput"
          class="tips-search__input"
          type="search"
          placeholder="Search words..."
          autocomplete="off"
          aria-label="Search words"
        />
        <div id="searchResults" class="search-results" role="listbox" aria-live="polite"></div>
      </div>
    </section>

    <section class="letter-grid-section">
      <div id="letterGrid" class="letter-grid" aria-label="Browse by letter">
        <!-- Letters injected by tips.js -->
      </div>
    </section>
  </main>

  <aside id="settingsSidebar" aria-label="Settings Menu">
    <h2 class="settings-title">Settings</h2>

    <button id="muteBtn" class="settings-btn" aria-pressed="false">
      <i class="ph ph-speaker-simple-high"></i> <span>Mute</span>
    </button>
    <button id="darkModeBtn" class="settings-btn" aria-pressed="false">
      <i class="ph ph-moon"></i> <span>Dark Mode</span>
    </button>

    <div class="settings-divider"></div>

    <button id="Howtoplay" class="settings-btn" onclick="window.location.href='HTP.html'">
      <i class="ph ph-book-open"></i> <span>How to Play</span>
    </button>
    <button id="feedbackBtn" class="settings-btn" onclick="window.location.href='feedback.html'">
      <i class="ph ph-pencil-simple"></i> <span>Feedback</span>
    </button>
    <button id="Tips" class="settings-btn" onclick="window.location.href='tips.html'">
      <i class="ph ph-gift"></i> <span>Tips</span>
    </button>
  </aside>

  <div id="letterModal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content letter-modal">
      <div class="modal-header">
        <h2 class="modal-title">Letter: <span id="activeLetter">A</span></h2>
        <button id="letterModalClose" class="icon-btn" aria-label="Close letter modal">
          <i class="ph ph-x"></i>
        </button>
      </div>

      <div id="letterWordGrid" class="letter-word-grid">
        <!-- Words injected by tips.js -->
      </div>

      <div class="modal-footer">
        <button id="prevLetterBtn" class="button secondary-btn">Prev</button>
        <button id="nextLetterBtn" class="button">Next</button>
      </div>
    </div>
  </div>

  <div id="wordModal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content word-modal">
      <div class="modal-header">
        <h2 id="wordModalTitle" class="modal-title">Word</h2>
      </div>

      <div class="word-modal-actions">
        <button id="ttsBtn" class="button secondary-btn">
          <i class="ph ph-speaker-high"></i> Speak
        </button>
        <button id="copyWordBtn" class="button secondary-btn">
          <i class="ph ph-copy"></i> Copy
        </button>
      </div>

      <div id="wordCopyFeedback" class="word-copy-feedback" aria-live="polite"></div>

      <div class="modal-footer">
        <button id="wordModalBack" class="button">Back</button>
      </div>
    </div>
  </div>

  <script src="/js/tips.js"></script>
  <script src="/js/script2.js"></script>
</body>
</html>
