<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Results - Letter-Leap</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; justify-content: center; position: relative; max-width: 800px; margin: 0 auto;">
        <a href="index.html" style="position: absolute; left: 1rem; color: var(--text-primary); text-decoration: none;"><i class="ph ph-house"></i></a>
        <span>Battle Results</span>
    </div>
  </header>

  <main class="container" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
    <section style="text-align: center; margin-bottom: 2rem; background: var(--bg-secondary); padding: 2rem; border-radius: var(--radius-lg); border: 2px solid var(--accent-color);">
        <h1 id="winner-announcement" style="color: var(--text-primary);"><i class="ph ph-crown" style="color: var(--accent-color);"></i> <strong>Zabdiel</strong> wins!</h1>
        <p style="color: var(--text-secondary);">Reason: Opponent ran out of time</p>
    </section>

    <section style="margin-bottom: 2rem;">
        <h2 style="margin-bottom: 1rem;"><i class="ph ph-users"></i> Player Breakdown</h2>
        <div id="players-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
            <!-- Player cards injected by resultmm.js -->
        </div>
    </section>

    <section style="background: var(--bg-secondary); padding: 1.5rem; border-radius: var(--radius-lg); margin-bottom: 2rem;">
        <h3><i class="ph ph-link-simple"></i> Game Chain Recap</h3>
        <ul id="word-chain-list" style="margin-top: 1rem; max-height: 200px; overflow-y: auto;">
            <!-- Words injected by resultmm.js -->
        </ul>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 3rem;">
        <button class="button" onclick="window.location.href='mm.html'"><i class="ph ph-users"></i> Battle Again</button>
        <button class="button" style="background: var(--bg-tertiary); color: var(--text-primary);" onclick="window.location.href='index.html'"><i class="ph ph-house"></i> Home</button>
    </div>
  </main>
  
  <script src="/js/resultmm.js"></script>
</body>
</html>
