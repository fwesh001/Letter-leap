<!DOCTYPE html> 
<html lang="en">  
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer - Letter-leap</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .room-menu {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    Multiplayer - Letter-leap
  </header>
  <main>
    <section class="room-system" id="room-system">
      <div class="room-menu" id="room-menu">
        <button id="menu-create-btn" class="button">Create Room</button>
        <button id="menu-join-btn" class="button">Join Room</button>
      </div>
      <div class="create-room" style="display:none;">
        <input type="text" id="create-room-name" placeholder="Room name">
        <button id="create-room-btn" class="button">Create Room</button>
        <label class="switch">
          <input type="checkbox" id="ai-toggle">
          <span class="slider"></span>
        </label>
        <span style="margin-left: 0.5rem;">AI Opponent</span>
      </div>
      <div class="join-room" style="display:none;">
        <input type="text" id="join-room-name" placeholder="Room name">
        <button id="join-room-btn" class="button">Join Room</button>
      </div>

            <!-- Player Count Display -->
<div id="player-counter" class="player-counter" style="display:none;">
  0 players in the room
</div>


      <div class="choose-letter" id="choose-letter-section" style="display:none;">
        <label for="start-letter">Choose starting letter:</label>
        <select id="start-letter">
          <option value="">Random</option>
          <!-- JS will fill A-Z -->
        </select>
        <button id="choose-letter-btn" class="button">Start Game</button>
      </div>
      <div id="waiting-message" class="waiting-message" style="display:none;">
        <div class="spinner"></div>
        Waiting for opponent to join...
      </div>
    </section>

    <section class="game-area" id="game-area" style="display:none;">
      <div id="room-name-display" class="room-name"></div>
<!-- Dynamic Scoreboard -->
<div class="scoreboard" id="scoreboard">
  <!-- JS will inject player rows here -->
</div>
      <div class="timer">
        Time left: <span id="timer-value">15s</span>
      </div>
      <div id="next-letter-display" class="next-letter"></div>

      <!-- Move last-words display here -->
      <div class="last-words" id="last-words-display">
        <span id="last-word-prev">none</span>
        <span class="arrow">➡️</span>
        <span id="last-word-current">none</span>
      </div>

      <div class="word-input-area">
        <input type="text" id="word-input" placeholder="Type your word..." autocomplete="off">
        <button id="submit-word-btn" class="button">Submit</button>
      </div>
      <div class="word-history">
        <h3>Word Chain History</h3>
        <ul id="word-chain-list"></ul>
      </div>
    </section>
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
      <div class="modal">
        <span id="modal-message"></span>
        <input id="modal-input" style="display:none; margin-top:1rem;" class="modal-input" type="text" />
        <button id="modal-close-btn" class="button">OK</button>
      </div>
    </div>
    <div id="ai-indicator" class="ai-indicator" style="display:none;">
      🤖 AI Opponent is playing in this room
    </div> 
    <button class="button" onclick="window.location.href='loading.html'">Home</button><p></p>
    <button class="button" onclick="window.location.href='mm.html'">Back</button>
    
    <!--Audio-->
<audio id="sound-click" src="/assets/sounds/click.mp3" preload="auto"></audio>
<audio id="sound-correct" src="/assets/sounds/ding.mp3" preload="auto"></audio>
<audio id="sound-wrong" src="/assets/sounds/buzz.mp3" preload="auto"></audio>


  </main>
  
  <footer>
    &copy; 2025 Letter-leap - Multiplayer.
  </footer>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var menu = document.getElementById('room-menu');
      var createForm = document.querySelector('.create-room');
      var joinForm = document.querySelector('.join-room');
      var playerCounter = document.getElementById('player-counter');
      var chooseLetter = document.getElementById('choose-letter-section');
      var waiting = document.getElementById('waiting-message');
      var menuCreate = document.getElementById('menu-create-btn');
      var menuJoin = document.getElementById('menu-join-btn');
      if (menuCreate) {
        menuCreate.addEventListener('click', function() {
          if (menu) menu.style.display = 'none';
          if (createForm) createForm.style.display = 'flex';
          if (joinForm) joinForm.style.display = 'none';
          if (chooseLetter) chooseLetter.style.display = 'none';
          if (waiting) waiting.style.display = 'none';
        });
      }
      if (menuJoin) {
        menuJoin.addEventListener('click', function() {
          if (menu) menu.style.display = 'none';
          if (joinForm) joinForm.style.display = 'flex';
          if (createForm) createForm.style.display = 'none';
          if (chooseLetter) chooseLetter.style.display = 'none';
          if (waiting) waiting.style.display = 'none';
        });
      }
      var createBtn = document.getElementById('create-room-btn');
      var joinBtn = document.getElementById('join-room-btn');
      if (createBtn) createBtn.addEventListener('click', function() {
        if (createForm) createForm.style.display = 'none';
        if (joinForm) joinForm.style.display = 'none';
        if (playerCounter) playerCounter.style.display = 'block';
      });
      if (joinBtn) joinBtn.addEventListener('click', function() {
        if (createForm) createForm.style.display = 'none';
        if (joinForm) joinForm.style.display = 'none';
        if (playerCounter) playerCounter.style.display = 'block';
      });
    });
  </script>
</body>
</html>
